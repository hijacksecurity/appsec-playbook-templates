name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  exception-register:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shellcheck
        run: shellcheck operating-model/exception-register/scripts/*.sh operating-model/exception-register/tests/*.sh
      - name: Valid exceptions pass, invalid ones fail
        run: operating-model/exception-register/tests/run-tests.sh

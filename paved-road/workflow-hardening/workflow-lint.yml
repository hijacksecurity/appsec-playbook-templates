# Copy to .github/workflows/workflow-lint.yml, and copy install-linters.sh to
# .github/scripts/install-linters.sh. Then make "workflow-lint" a required status check.
# zizmor finds security problems in workflows (dangerous triggers, unpinned actions,
# broad token permissions, template injection, leaked credentials). actionlint finds
# mistakes (bad syntax, wrong expressions, and shell bugs through shellcheck).
name: workflow-lint
on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
permissions: {}
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor and actionlint (pinned, checksums verified)
        run: .github/scripts/install-linters.sh "$RUNNER_TEMP/linters"
      - name: zizmor
        env:
          # Read-only token for zizmor's online audits (for example, actions with known
          # vulnerabilities, and commits that don't belong to the repo they claim).
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/linters/bin/zizmor" --format github .github/'
      - name: actionlint
        run: '"$RUNNER_TEMP/linters/bin/actionlint" -color'
